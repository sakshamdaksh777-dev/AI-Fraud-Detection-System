
services:
  db:
    image: postgres:16
    container_name: fraud-postgres
    environment:
      POSTGRES_DB: fraud_detection
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fraud_detection"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud-api
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: fraud_detection
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      FRAUD_API_KEY: ${FRAUD_API_KEY}
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud-dashboard
    command:
      - streamlit
      - run
      - dashboard/dashboard/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
    environment:
      FRAUD_API_KEY: ${FRAUD_API_KEY}
      API_URL: http://api:8001
    ports:
      - "8502:8501"
    depends_on:
      - api

volumes:
  postgres_data:
